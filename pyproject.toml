[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "xls-to-xlsx-converter"
version = "1.0.0"
description = "Offline conversion of binary and HTML-disguised XLS files to XLSX."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LHSCode" }]
keywords = ["excel", "xls", "xlsx", "spreadsheet", "converter", "offline"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
  "beautifulsoup4>=4.14.3,<5",
  "lxml>=6.0.2,<7",
  "openpyxl>=3.1.5,<4",
  "xlrd>=2.0.2,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "setuptools>=83",
  "xlwt>=1.3,<2",
]
build = [
  "pillow>=11,<14",
  "pyinstaller>=6.22,<7",
]

[project.urls]
Homepage = "https://dcapps.lhs.codes/"
Repository = "https://github.com/ANomaly18/xls-to-xlsx-converter"
Issues = "https://github.com/ANomaly18/xls-to-xlsx-converter/issues"

[project.scripts]
xls2xlsx = "xls_to_xlsx_converter.cli:main"

[project.gui-scripts]
xls2xlsx-gui = "xls_to_xlsx_converter.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["xls_to_xlsx_converter"]
omit = [
  "src/xls_to_xlsx_converter/__main__.py",
  "src/xls_to_xlsx_converter/constants.py",
  "src/xls_to_xlsx_converter/main.py",
]
